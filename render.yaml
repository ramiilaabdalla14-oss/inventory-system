# Render Blueprint — API + PostgreSQL (no Azure needed)
databases:
  - name: inventory-db
    plan: free
    databaseName: inventory

services:
  - type: web
    name: inventory-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:10000
      - key: Database__Provider
        value: PostgreSQL
      - key: Jwt__Issuer
        value: InventoryAPI
      - key: Jwt__Audience
        value: InventoryUsers
      - key: Jwt__Key
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
