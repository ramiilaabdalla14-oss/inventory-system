services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ChangeMe!StrongPass123}"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=InventoryDB;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChangeMe!StrongPass123};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: "${JWT_KEY:-THIS_IS_SECRET_KEY_123456789012345678901234567890}"
      Jwt__Issuer: InventoryAPI
      Jwt__Audience: InventoryUsers
      Cors__Origins__0: "${FRONTEND_URL:-http://localhost:5173}"
      Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
      Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
      Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080/api}"
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mssql_data:
